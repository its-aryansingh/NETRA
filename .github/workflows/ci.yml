name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-mock cedarpy

      - name: Run pytest
        run: |
          cd backend
          python -m pytest tests/ -v

  infra:
    name: CloudFormation & SAM Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install cfn-lint aws-sam-cli

      - name: Run cfn-lint
        run: cfn-lint infra/template.yaml

      - name: Validate SAM template
        run: sam validate -t infra/template.yaml --lint

      - name: Install CloudFormation Guard
        run: |
          curl -Lo cfn-guard.tar.gz https://github.com/aws-cloudformation/cloudformation-guard/releases/latest/download/cfn-guard-v3-ubuntu-latest.tar.gz
          tar -xzf cfn-guard.tar.gz
          chmod +x cfn-guard
          sudo mv cfn-guard /usr/local/bin/

      - name: Run CloudFormation Guard
        run: cfn-guard validate -d infra/template.yaml -r infra/rules/netra.guard --show-summary all

  frontend:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Production build
        env:
          NEXT_PUBLIC_DEMO: "1"
        run: npm run build

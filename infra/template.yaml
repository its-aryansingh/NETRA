AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  NETRA — Near-real-time Expenditure Tracking & Remediation Agent.
  WeMakeDevs × AWS · First Commit 2026 · Ship It track

Parameters:
  AlertEmail:
    Type: String
    Default: ""
    Description: "Email address for critical spend notifications via SNS"
  OpenAiApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: "OpenAI API key for root cause narration (gpt-4o-mini)"
  ModelProvider:
    Type: String
    Default: "openai"
    Description: "Primary LLM provider: openai, bedrock, or ollama"
  OpenAiModel:
    Type: String
    Default: "gpt-4o-mini"
    Description: "OpenAI model ID for investigation agent"

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Globals:
  Function:
    Timeout: 60
    MemorySize: 512
    Runtime: python3.12
    Environment:
      Variables:
        NETRA_PRICE_DOCS_BUCKET: !Ref NetraPriceDocsBucket
        NETRA_TABLE_BURN_SNAPSHOTS: !Ref NetraBurnSnapshotsTable
        NETRA_TABLE_PRICE_CACHE: !Ref NetraPriceCacheTable
        NETRA_TABLE_FINDINGS: !Ref NetraFindingsTable
        NETRA_TABLE_AUDIT_LOG: !Ref NetraAuditLogTable
        NETRA_TABLE_AUTH_KEYS: !Ref NetraAuthKeysTable
        NETRA_USD_INR: "88.50"
        NETRA_CREDITS_INITIAL_USD: "200.0"
        NETRA_CREDITS_REMAINING_USD: "200.0"
        NETRA_LOG_LEVEL: "INFO"

Resources:
  # ----------------------------------------------------------------------------
  # DynamoDB Storage Tables (Pay-per-request billing, TTL on transient records)
  # ----------------------------------------------------------------------------

  NetraBurnSnapshotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: netra_burn_snapshots
      BillingMode: PAY_PER_REQUEST
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  NetraPriceCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: netra_price_cache
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  NetraFindingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: netra_findings
      BillingMode: PAY_PER_REQUEST
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: detected_at
          AttributeType: N
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: status-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: detected_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  NetraAuditLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: netra_audit_log
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  NetraAuthKeysTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: netra_auth_keys
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ----------------------------------------------------------------------------
  # S3 Provenance Storage (Prompt G: Hashed Price Documents)
  # ----------------------------------------------------------------------------

  NetraPriceDocsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "netra-price-docs-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ----------------------------------------------------------------------------
  # Lambda Functions
  # ----------------------------------------------------------------------------

  CollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: netra-collector
      Description: Inventories active AWS resources, prices them, computes baseline, and detects anomalies
      CodeUri: ../backend
      Handler: netra.collector.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ec2:DescribeInstances
                - ec2:DescribeVolumes
                - ec2:DescribeNatGateways
                - cloudwatch:GetMetricData
                - pricing:GetProducts
              Resource: "*"
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !GetAtt NetraBurnSnapshotsTable.Arn
                - !GetAtt NetraPriceCacheTable.Arn
                - !GetAtt NetraFindingsTable.Arn
                - !Sub "${NetraFindingsTable.Arn}/index/*"
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource: "*"
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "${NetraPriceDocsBucket.Arn}/*"
      Events:
        CollectorSchedule:
          Type: Schedule
          Properties:
            Schedule: "rate(1 minute)"
            Name: netra-collector-schedule
            Description: "Triggers NETRA collector every 60 seconds (sweep path)"
            Input: '{"fast_path": false}'
        FastPathRule:
          Type: CloudWatchEvent
          Properties:
            Pattern:
              source:
                - "aws.ec2"
              detail-type:
                - "EC2 Instance State-change Notification"
                - "AWS API Call via CloudTrail"
              detail:
                state:
                  - "running"
                  - "pending"
                eventName:
                  - "RunInstances"
                  - "CreateVolume"
                  - "CreateNatGateway"

  # ----------------------------------------------------------------------------
  # SNS & SQS Plumbing (Prompt K: Decoupled Queue with DLQ & Phone Alerting)
  # ----------------------------------------------------------------------------

  NetraCriticalFindingsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: netra-critical-findings
      DisplayName: NETRA Critical Spend Alerts

  NetraCriticalFindingsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref NetraCriticalFindingsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  NetraFindingsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: netra-findings-dlq
      MessageRetentionPeriod: 345600 # 4 days

  NetraFindingsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: netra-findings-queue
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600 # 4 days
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NetraFindingsDLQ.Arn
        maxReceiveCount: 3

  NetraFindingsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref NetraFindingsQueue
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt NetraFindingsQueue.Arn

  FindingCreatedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: netra-finding-created-rule
      Description: "Routes netra.finding.created events to SQS findings queue"
      EventPattern:
        source:
          - "netra.collector"
        detail-type:
          - "netra.finding.created"
      Targets:
        - Arn: !GetAtt NetraFindingsQueue.Arn
          Id: "NetraFindingsQueueTarget"

  # Stub for Phase 4: Bedrock/Strands Investigator Agent
  InvestigatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: netra-investigator
      Description: Strands investigation agent narrating detected anomalies with deterministic fallback
      CodeUri: ../backend
      Handler: netra.agent.investigator.lambda_handler
      Timeout: 120
      Environment:
        Variables:
          NETRA_SNS_TOPIC_ARN: !Ref NetraCriticalFindingsTopic
          NETRA_ALERT_TOPIC_ARN: !Ref NetraCriticalFindingsTopic
          NETRA_DASHBOARD_URL: "https://main.d123456789.amplifyapp.com"
          OPENAI_API_KEY: !Ref OpenAiApiKey
          NETRA_MODEL_PROVIDER: !Ref ModelProvider
          NETRA_OPENAI_MODEL: !Ref OpenAiModel
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock:Converse
              Resource:
                - !Sub "arn:aws:bedrock:*::foundation-model/*"
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:PutItem
                - dynamodb:Query
              Resource:
                - !GetAtt NetraFindingsTable.Arn
                - !Sub "${NetraFindingsTable.Arn}/index/*"
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref NetraCriticalFindingsTopic
            - Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource: !GetAtt NetraFindingsQueue.Arn
      Events:
        FindingsQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt NetraFindingsQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

  # Stub for Phase 5: HTTP API
  NetraHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: "$default"
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - content-type
          - authorization
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        MaxAge: 300

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: netra-api
      Description: REST / HTTP API routing queries for dashboard, findings, and approvals
      CodeUri: ../backend
      Handler: netra.api.lambda_handler
      Timeout: 30
      Environment:
        Variables:
          NETRA_STATE_MACHINE_ARN: !Ref NetraRemediateStateMachine
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt NetraBurnSnapshotsTable.Arn
                - !GetAtt NetraPriceCacheTable.Arn
                - !GetAtt NetraFindingsTable.Arn
                - !Sub "${NetraFindingsTable.Arn}/index/*"
                - !GetAtt NetraAuditLogTable.Arn
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "${NetraPriceDocsBucket.Arn}/*"
            - Effect: Allow
              Action:
                - states:StartExecution
              Resource: !Ref NetraRemediateStateMachine
            - Effect: Allow
              Action:
                - ce:GetCostAndUsage
              Resource: "*"
      Events:
        HttpApiCatchAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref NetraHttpApi
            Path: /{proxy+}
            Method: ANY

  # Phase 7: Remediation Executor Lambda
  ExecutorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: netra-executor
      Description: Executes human-approved remediations with dry-run, snapshotting, and audit logging
      CodeUri: ../backend
      Handler: netra.executor.lambda_handler
      Timeout: 60
      Policies:
        - Statement:
            # Statement A: Unconditioned read, snapshot, and DynamoDB audit actions
            - Effect: Allow
              Action:
                - ec2:DescribeInstances
                - ec2:DescribeVolumes
                - ec2:DescribeNatGateways
                - ec2:DescribeSnapshots
                - ec2:CreateSnapshot
                - ec2:CreateVolume
                - ec2:CreateTags
              Resource: "*"
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:PutItem
              Resource:
                - !GetAtt NetraFindingsTable.Arn
                - !GetAtt NetraAuditLogTable.Arn
            # Statement B: Mutating remediation actions conditioned on netra:managed tag
            - Effect: Allow
              Action:
                - ec2:StopInstances
                - ec2:StartInstances
                - ec2:TerminateInstances
                - ec2:DeleteVolume
                - ec2:DeleteNatGateway
              Resource: "*"
              Condition:
                StringEquals:
                  "aws:ResourceTag/netra:managed": "true"

  # Phase 7: Step Functions State Machine
  NetraRemediateStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: netra-remediate
      Definition:
        Comment: "NETRA 5-Stage Human-Gated Remediation Workflow"
        StartAt: Authorize
        States:
          Authorize:
            Type: Task
            Resource: !GetAtt ExecutorFunction.Arn
            Parameters:
              finding_id.$: "$.finding_id"
              action.$: "$.action"
              approved_by.$: "$.approved_by"
              step: "authorize"
            Catch:
              - ErrorEquals: ["States.ALL"]
                Next: FailAndAudit
            Next: DryRun
          DryRun:
            Type: Task
            Resource: !GetAtt ExecutorFunction.Arn
            Parameters:
              finding_id.$: "$.finding_id"
              action.$: "$.action"
              step: "dry_run"
            Catch:
              - ErrorEquals: ["States.ALL"]
                Next: FailAndAudit
            Next: Snapshot
          Snapshot:
            Type: Task
            Resource: !GetAtt ExecutorFunction.Arn
            Parameters:
              finding_id.$: "$.finding_id"
              action.$: "$.action"
              step: "snapshot"
            Catch:
              - ErrorEquals: ["States.ALL"]
                Next: FailAndAudit
            Next: Act
          Act:
            Type: Task
            Resource: !GetAtt ExecutorFunction.Arn
            Parameters:
              finding_id.$: "$.finding_id"
              action.$: "$.action"
              step: "act"
            Catch:
              - ErrorEquals: ["States.ALL"]
                Next: FailAndAudit
            Next: RecordAudit
          RecordAudit:
            Type: Task
            Resource: !GetAtt ExecutorFunction.Arn
            Parameters:
              finding_id.$: "$.finding_id"
              action.$: "$.action"
              approved_by.$: "$.approved_by"
              step: "record_audit"
              ok: true
            End: true
          FailAndAudit:
            Type: Task
            Resource: !GetAtt ExecutorFunction.Arn
            Parameters:
              finding_id.$: "$.finding_id"
              action.$: "$.action"
              approved_by.$: "$.approved_by"
              step: "record_audit"
              ok: false
            End: true
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref ExecutorFunction

  # Prompt O: Automated Rollback State Machine
  NetraRollbackStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: netra-rollback
      Definition:
        Comment: "NETRA One-Click Automated Rollback Pipeline"
        StartAt: RestoreResource
        States:
          RestoreResource:
            Type: Task
            Resource: !GetAtt ExecutorFunction.Arn
            Parameters:
              finding_id.$: "$.finding_id"
              snapshot_id.$: "$.snapshot_id"
              approved_by.$: "$.approved_by"
              step: "rollback"
            End: true
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref ExecutorFunction

  # Phase 4 (v3): MCP Action Server Lambda (Exclusive mutating IAM boundary)
  McpActionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: netra-mcp-actions
      Description: Model Context Protocol action server executing approved remediations
      CodeUri: ../backend
      Handler: netra.mcp.server.lambda_handler
      Timeout: 60
      FunctionUrlConfig:
        AuthType: AWS_IAM
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ec2:DescribeInstances
                - ec2:DescribeVolumes
                - ec2:DescribeNatGateways
                - ec2:StopInstances
                - ec2:TerminateInstances
                - ec2:DeleteVolume
                - ec2:CreateSnapshot
                - ec2:DeleteNatGateway
              Resource: "*"
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:PutItem
                - dynamodb:Query
              Resource:
                - !GetAtt NetraFindingsTable.Arn
                - !Sub "${NetraFindingsTable.Arn}/index/*"
                - !GetAtt NetraAuditLogTable.Arn
                - !GetAtt NetraBurnSnapshotsTable.Arn
                - !GetAtt NetraPriceCacheTable.Arn

  # ----------------------------------------------------------------------------
  # CloudWatch Dashboard & Alarms (Prompt K: Telemetry & Critical Guardrails)
  # ----------------------------------------------------------------------------

  NetraCloudWatchDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: NETRA
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Spend Velocity (₹/hr)",
                "metrics": [
                  [ "NETRA", "BurnRateINRPerHour" ]
                ],
                "period": 60,
                "stat": "Average",
                "region": "${AWS::Region}",
                "view": "timeSeries"
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Detection Latency (ms)",
                "metrics": [
                  [ "NETRA", "DetectionLatencyMs", { "stat": "p50", "label": "p50" } ],
                  [ "...", { "stat": "p99", "label": "p99" } ]
                ],
                "period": 60,
                "region": "${AWS::Region}",
                "view": "timeSeries"
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Open Findings Count",
                "metrics": [
                  [ "NETRA", "OpenFindings" ]
                ],
                "period": 60,
                "stat": "Maximum",
                "region": "${AWS::Region}",
                "view": "singleValue"
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Recovered Spend (₹)",
                "metrics": [
                  [ "NETRA", "RecoveredINR" ]
                ],
                "period": 60,
                "stat": "Sum",
                "region": "${AWS::Region}",
                "view": "singleValue"
              }
            }
          ]
        }

  NetraBurnRateCriticalAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: netra-burn-rate-critical
      AlarmDescription: "Alerts when account burn rate exceeds ₹300/hr for 2 consecutive minutes"
      Namespace: NETRA
      MetricName: BurnRateINRPerHour
      Statistic: Average
      Period: 60
      EvaluationPeriods: 2
      Threshold: 300.0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref NetraCriticalFindingsTopic

Outputs:
  ApiUrl:
    Description: "HTTP API Gateway endpoint URL for the NETRA dashboard"
    Value: !Sub "https://${NetraHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  CollectorFunctionArn:
    Description: "ARN of the Collector Lambda"
    Value: !GetAtt CollectorFunction.Arn
  ApiFunctionArn:
    Description: "ARN of the HTTP API Lambda"
    Value: !GetAtt ApiFunction.Arn
  ExecutorFunctionArn:
    Description: "ARN of the Executor Lambda"
    Value: !GetAtt ExecutorFunction.Arn
  McpActionsFunctionArn:
    Description: "ARN of the MCP Action Server Lambda"
    Value: !GetAtt McpActionsFunction.Arn
  McpActionsFunctionUrl:
    Description: "Function URL of the MCP Action Server Lambda"
    Value: !GetAtt McpActionsFunctionUrl.FunctionUrl
  StateMachineArn:
    Description: "ARN of the Remediation Step Functions State Machine"
    Value: !GetAtt NetraRemediateStateMachine.Arn
  BurnSnapshotsTableArn:
    Description: "ARN of Burn Snapshots DynamoDB Table"
    Value: !GetAtt NetraBurnSnapshotsTable.Arn
  FindingsTableArn:
    Description: "ARN of Findings DynamoDB Table"
    Value: !GetAtt NetraFindingsTable.Arn
  AuditLogTableArn:
    Description: "ARN of Audit Log DynamoDB Table"
    Value: !GetAtt NetraAuditLogTable.Arn
  CriticalFindingsTopicArn:
    Description: "ARN of the Critical Findings SNS Topic"
    Value: !Ref NetraCriticalFindingsTopic
  FindingsQueueArn:
    Description: "ARN of the SQS Findings Queue"
    Value: !GetAtt NetraFindingsQueue.Arn
  FindingsDLQArn:
    Description: "ARN of the SQS Dead-Letter Queue"
    Value: !GetAtt NetraFindingsDLQ.Arn
  DashboardName:
    Description: "Name of the NETRA CloudWatch Dashboard"
    Value: !Ref NetraCloudWatchDashboard
  PriceDocsBucket:
    Description: "Name of S3 bucket storing hashed AWS Price List provenance documents"
    Value: !Ref NetraPriceDocsBucket
